name: AI资讯自动推送

on:
  schedule:
    # 每天北京时间早上8:00执行（UTC时间00:00）
    - cron: '0 0 * * *'
  
  # 支持手动触发
  workflow_dispatch:

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 运行资讯采集脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python ai_news_collector.py
      
      - name: 任务完成通知
        if: success()
        run: echo "✅ AI资讯推送任务执行成功！"
      
      - name: 任务失败通知
        if: failure()
        run: echo "❌ AI资讯推送任务执行失败，请检查日志"
